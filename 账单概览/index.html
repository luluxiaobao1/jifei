<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账单概览 - 360智汇云</title>
  <link rel="stylesheet" href="../shared/base.css?v=20260905c">
  <link rel="stylesheet" href="styles.css?v=20260905c">
</head>

<body class="subview">
<!-- 内容片段：顶栏 / 图标栏 / 侧边栏 / 面包屑 / 浮动条均由外壳页 ../index.html 提供。
     本页仅经 iframe 由外壳加载，不作为独立入口访问。

     页面结构：维度 Tab（企业 / 结算单元 / 资源组）在上，
     每个维度内用分段控件切换四种视图：
       日报表  某一天各产品的账单，默认昨天
       月报表  某一月各产品的账单，默认当前月
       日趋势  选中日期区间内每天的消费趋势，默认最近 1 个月
       月趋势  选中月份区间内每月的消费趋势，默认最近 6 个月
     报表视图只出表格，趋势视图只出曲线图。 -->
      <main class="main-content">
        <!-- 角色演示切换：收进右下角悬浮按钮，不占首屏高度 -->
        <button type="button" class="role-fab" id="role-fab" aria-expanded="false" aria-controls="role-pop">
          <svg class="role-fab-ico" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="5.5" r="2.75" stroke="currentColor" stroke-width="1.3" />
            <path d="M2.75 13.5c0-2.4 2.35-3.75 5.25-3.75s5.25 1.35 5.25 3.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span>演示角色：</span>
          <span class="role-fab-name" id="role-fab-name">主账号</span>
          <svg class="role-fab-arrow" viewBox="0 0 12 12" fill="none">
            <path d="M2 4.5L6 8.5L10 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="role-pop" id="role-pop">
          <div class="role-pop-title">切换演示角色</div>
          <div class="role-btn-group">
            <span class="role-set" title="主账号 / 企业管理员 / 系统管理员 权限一致：可查看企业下全部账单">
              <span class="role-set-tag">同权限</span>
              <button class="role-btn active" data-role="master" data-tab="enterprise">主账号</button>
              <button class="role-btn" data-role="enterprise-admin" data-tab="enterprise">企业管理员</button>
              <button class="role-btn" data-role="sys-admin" data-tab="enterprise">系统管理员</button>
            </span>
            <button class="role-btn" data-role="billing-admin" data-tab="billing-unit">结算单元管理员</button>
            <button class="role-btn" data-role="rg-admin" data-tab="resource-group">资源组管理员</button>
          </div>
          <span class="role-hint" id="role-hint">主账号 / 企业管理员 / 系统管理员：可查看企业下全部账单（企业账单 / 结算单元账单 / 资源组账单）</span>
        </div>

        <!-- 出账时间提示：粉色背景，放在内容区上面 -->
        <div class="notice">
          1、月账单：次月第3个工作日8点后为准确数据；2、天账单：次日14点后为准确数据。
        </div>

        <section class="panel">
          <!-- Tabs -->
          <div class="tabs" id="bill-tabs">
            <div class="tab active" data-panel="enterprise">企业账单</div>
            <div class="tab" data-panel="billing-unit">结算单元账单</div>
            <div class="tab" data-panel="resource-group">资源组账单</div>
          </div>

          <!-- ===== 企业账单面板 ===== -->
          <div class="tab-panel active" id="panel-enterprise">
            <div class="filter-bar" data-dim="enterprise">
              <!-- 视图分段控件与筛选项同行，节省纵向空间 -->
              <div class="view-seg" data-dim="enterprise">
                <button type="button" class="seg-btn active" data-view="day-report">日报表</button>
                <button type="button" class="seg-btn" data-view="month-report">月报表</button>
                <button type="button" class="seg-btn" data-view="day-trend">日趋势</button>
                <button type="button" class="seg-btn" data-view="month-trend">月趋势</button>
              </div>
              <!-- 日期控件：内容随视图（单选 / 区间 × 日 / 月）由 JS 重建 -->
              <div class="date-ctl" id="date-enterprise"></div>

              <button class="btn btn-primary" data-action="search">搜 索</button>
              <span class="range-tip"></span>
            </div>

            <!-- 趋势视图：总账趋势卡片（柱状金额 + 折线环比）+ 产品/结算单元/资源组拆分模块，由 JS 渲染 -->
            <div class="trend-box" id="chartbox-enterprise"></div>

            <!-- 报表视图：产品明细表。企业账单可在「按产品 / 按结算单元」两种粒度间切换 -->
            <div class="report-box" id="reportbox-enterprise">
              <div class="period-card" id="periodcard-enterprise"></div>
              <div class="table-toolbar">
                <div class="group-seg" id="group-seg-enterprise">
                  <button type="button" class="seg-btn active" data-group="product">按产品</button>
                  <button type="button" class="seg-btn" data-group="billing-unit">按结算单元</button>
                  <button type="button" class="seg-btn" data-group="resource-group">按资源组</button>
                </div>
                <div class="table-toolbar-right">
                  <div class="report-filter" id="report-filter-enterprise"></div>
                  <button class="btn btn-link btn-export">导出数据</button>
                </div>
              </div>
              <div class="table-wrap">
                <table class="report-table">
                  <thead id="thead-ep"></thead>
                  <tbody id="tbody-ep"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ===== 结算单元账单面板 ===== -->
          <div class="tab-panel" id="panel-billing-unit">
            <div class="filter-bar" data-dim="billing-unit">
              <!-- 视图分段控件与筛选项同行，节省纵向空间 -->
              <div class="view-seg" data-dim="billing-unit">
                <button type="button" class="seg-btn active" data-view="day-report">日报表</button>
                <button type="button" class="seg-btn" data-view="month-report">月报表</button>
                <button type="button" class="seg-btn" data-view="day-trend">日趋势</button>
                <button type="button" class="seg-btn" data-view="month-trend">月趋势</button>
              </div>
              <div class="date-ctl" id="date-billing-unit"></div>

              <!-- 结算单元单选（必填，默认第一个有权限的结算单元） -->
              <div class="singleselect required-field" id="ss-bu-unit">
                <div class="ms-trigger" id="ss-bu-trigger">
                  <span class="ms-placeholder" id="ss-bu-label">请选择结算单元</span>
                  <svg class="ms-arrow" viewBox="0 0 12 12" fill="none" width="12" height="12">
                    <path d="M2 4.5L6 8.5L10 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
                <div class="ms-dropdown" id="ss-bu-dropdown"></div>
              </div>

              <button class="btn btn-primary" data-action="search">搜 索</button>
              <span class="range-tip"></span>
            </div>

            <div class="trend-box" id="chartbox-billing-unit"></div>

            <div class="report-box" id="reportbox-billing-unit">
              <div class="period-card" id="periodcard-billing-unit"></div>
              <div class="table-toolbar">
                <div class="group-seg" id="group-seg-billing-unit">
                  <button type="button" class="seg-btn active" data-group="product">按产品</button>
                  <button type="button" class="seg-btn" data-group="resource-group">按资源组</button>
                </div>
                <div class="table-toolbar-right">
                  <div class="report-filter" id="report-filter-billing-unit"></div>
                  <button class="btn btn-link btn-export">导出数据</button>
                </div>
              </div>
              <div class="table-wrap">
                <table class="report-table">
                  <thead id="thead-bp"></thead>
                  <tbody id="tbody-bp"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ===== 资源组账单面板 ===== -->
          <div class="tab-panel" id="panel-resource-group">
            <div class="filter-bar" data-dim="resource-group">
              <!-- 视图分段控件与筛选项同行，节省纵向空间 -->
              <div class="view-seg" data-dim="resource-group">
                <button type="button" class="seg-btn active" data-view="day-report">日报表</button>
                <button type="button" class="seg-btn" data-view="month-report">月报表</button>
                <button type="button" class="seg-btn" data-view="day-trend">日趋势</button>
                <button type="button" class="seg-btn" data-view="month-trend">月趋势</button>
              </div>
              <div class="date-ctl" id="date-resource-group"></div>

              <!-- 结算单元单选（必填，默认第一个有权限的结算单元） -->
              <div class="singleselect required-field" id="ss-rg-bu">
                <div class="ms-trigger" id="ss-rg-bu-trigger">
                  <span class="ms-placeholder" id="ss-rg-bu-label">请选择结算单元</span>
                  <svg class="ms-arrow" viewBox="0 0 12 12" fill="none" width="12" height="12">
                    <path d="M2 4.5L6 8.5L10 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
                <div class="ms-dropdown" id="ss-rg-bu-dropdown"></div>
              </div>

              <!-- 资源组单选（必填，默认所选结算单元下第一个资源组） -->
              <div class="singleselect required-field" id="ss-rg-group">
                <div class="ms-trigger" id="ss-rg-trigger">
                  <span class="ms-placeholder" id="ss-rg-label">请选择资源组</span>
                  <svg class="ms-arrow" viewBox="0 0 12 12" fill="none" width="12" height="12">
                    <path d="M2 4.5L6 8.5L10 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
                <div class="ms-dropdown" id="ss-rg-dropdown"></div>
              </div>

              <button class="btn btn-primary" data-action="search">搜 索</button>
              <span class="range-tip"></span>
            </div>

            <!-- 趋势视图：总账趋势卡片 + 产品拆分模块，由 JS 渲染 -->
            <div class="trend-box" id="chartbox-resource-group"></div>

            <div class="report-box" id="reportbox-resource-group">
              <div class="period-card" id="periodcard-resource-group"></div>
              <div class="table-toolbar">
                <div class="group-seg" id="group-seg-resource-group">
                  <button type="button" class="seg-btn active" data-group="product">按产品</button>
                </div>
                <div class="table-toolbar-right">
                  <div class="report-filter" id="report-filter-resource-group"></div>
                  <button class="btn btn-link btn-export">导出数据</button>
                </div>
              </div>
              <div class="table-wrap">
                <table class="report-table">
                  <thead id="thead-rgp"></thead>
                  <tbody id="tbody-rgp"></tbody>
                </table>
              </div>
            </div>
          </div>

        </section>
      </main>

  <script src="app.js?v=20260905c"></script>
  <!-- 须在 app.js 之后：依赖 .role-btn 已绑好切换事件 -->
  <script src="../shared/role-fab.js?v=20260905c"></script>
</body>

</html>
